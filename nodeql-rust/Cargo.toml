[package]
name = "nodeql-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native Rust rewrite of the NodeQL visual SQLite workbench"
license = "MIT"
default-run = "nodeql-rust"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "nodeql-rust"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true
