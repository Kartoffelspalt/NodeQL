name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Workshop Admin dependencies
        working-directory: tools/workshop_admin
        run: flutter pub get
      - name: Install Onboarding Studio dependencies
        working-directory: tools/onboarding_studio
        run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check Workshop Admin formatting
        working-directory: tools/workshop_admin
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Check Onboarding Studio formatting
        working-directory: tools/onboarding_studio
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Analyze Workshop Admin
        working-directory: tools/workshop_admin
        run: flutter analyze
      - name: Analyze Onboarding Studio
        working-directory: tools/onboarding_studio
        run: flutter analyze
      - run: flutter test
      - name: Test browser preview
        run: flutter test --platform chrome test/platform/web_preview_test.dart
      - name: Build browser preview
        run: flutter build web --release
      - name: Test Workshop Admin
        working-directory: tools/workshop_admin
        run: flutter test
      - name: Test Onboarding Studio
        working-directory: tools/onboarding_studio
        run: flutter test
      - run: dart run tool/validate_translations.dart
