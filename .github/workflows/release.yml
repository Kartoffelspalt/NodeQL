name: Desktop Release

on:
  push:
    branches: [master, main]
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged dev-to-release-branch PR for the unpublished version
        type: number
        required: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_VERSION: '3.44.1'
  TRANSLATION_MANIFEST_URL: https://kartoffelspalt.github.io/NodeQL/translations/translation-manifest.json
  TRANSLATION_CONTRIBUTION_URL: https://github.com/Kartoffelspalt/NodeQL/blob/master/docs/localization/README.md

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      tag: ${{ steps.version.outputs.tag }}
      should-release: ${{ steps.release.outputs.should-release }}
      release-pr-number: ${{ steps.retry-release.outputs.pr-number || steps.release-notes.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the release pull request for this retry
        id: retry-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter the number of the original release pull request."
            exit 1
          fi
          pull_request="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          merge_sha="$(jq -er --arg branch "$BASE_BRANCH" --arg repo "$GITHUB_REPOSITORY" '
            select(.merged_at != null and .base.ref == $branch and
              .head.ref == "dev" and .head.repo.full_name == $repo) | .merge_commit_sha
          ' <<< "$pull_request")"
          if ! git merge-base --is-ancestor "$merge_sha" "$GITHUB_SHA"; then
            echo "::error::The release pull request merge must be an ancestor of this build."
            exit 1
          fi
          release_pubspec="$(git show "$merge_sha:pubspec.yaml")"
          release_version="$(sed -n 's/^version: *//p' <<< "$release_pubspec")"
          if [[ "$release_version" != "$(sed -n 's/^version: *//p' pubspec.yaml)" ]]; then
            echo "::error::The current build must have the same version as the release pull request."
            exit 1
          fi
          echo "previous-sha=$(git rev-parse "$merge_sha^")" >> "$GITHUB_OUTPUT"
          echo "pr-number=$RELEASE_PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Read and validate version
        id: version
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.retry-release.outputs.previous-sha || github.event.before }}
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
          PREVIOUS_PUBSPEC="$(git show "${PREVIOUS_SHA}:pubspec.yaml" 2>/dev/null || true)"
          PREVIOUS_VERSION="$(sed -n 's/^version: *//p' <<< "${PREVIOUS_PUBSPEC}")"
          python3 tool/validate_release_version.py \
            --current "${PUBSPEC_VERSION}" --previous "${PREVIOUS_VERSION}" \
            >> "${GITHUB_OUTPUT}"
      - name: Check whether release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_UPDATED: ${{ steps.version.outputs.version-updated }}
        shell: bash
        run: |
          if [[ "${VERSION_UPDATED}" != "true" ]]; then
            echo "Release version has not changed; skipping."
            echo "should-release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to publish."
            echo "should-release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should-release=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Find the dev-to-master release pull request
        id: release-notes
        if: github.event_name == 'push' && steps.release.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          pull_requests="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pr_number="$(jq -r \
            --arg base_branch "${BASE_BRANCH}" \
            '.[] | select(.base.ref == $base_branch and .head.ref == "dev" and .merged_at != null) | .number' \
            <<< "${pull_requests}" | head -n 1)"

          if [[ -z "${pr_number}" ]]; then
            echo "A new release must be published by merging a pull request from dev into ${BASE_BRANCH}." >&2
            exit 1
          fi

          echo "pr-number=${pr_number}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Quality gates
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release version validation
        run: python3 -m unittest discover -s test/tool -p '*_test.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/validate_translations.dart

  translations:
    name: Generate release language packs with Gemini
    needs: [prepare, quality]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODEQL_TRANSLATION_MODEL: ${{ vars.NODEQL_TRANSLATION_MODEL || 'gemini-3.8-flash' }}
      NODEQL_TRANSLATION_CONCURRENCY: ${{ vars.NODEQL_TRANSLATION_CONCURRENCY || '3' }}
      NODEQL_TRANSLATION_LOCALES: ${{ vars.NODEQL_TRANSLATION_LOCALES || 'de,fr,es,it,pt,tr,ar,ja,ko,zh' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Scope cache to translation configuration
        id: cache-scope
        shell: bash
        run: |
          scope="$(printf '%s\n' "$NODEQL_TRANSLATION_MODEL" "$NODEQL_TRANSLATION_LOCALES" | sha256sum | cut -d ' ' -f 1)"
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore-translations
        with:
          path: build/ai-translations
          key: gemini-translations-v1-${{ steps.cache-scope.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gemini-translations-v1-${{ steps.cache-scope.outputs.scope }}-
      - name: Generate missing and changed translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATION_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
        run: dart run tool/generate_translations.dart --revision="$TRANSLATION_BUILD_NUMBER"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && hashFiles('build/ai-translations/state.json') != '' }}
        with:
          path: build/ai-translations
          key: ${{ steps.restore-translations.outputs.cache-primary-key }}
      - name: Validate generated packages
        run: dart run tool/validate_translations.dart build/ai-translations/packages
      - name: Build language catalog
        env:
          NODEQL_TRANSLATION_MINIMUM_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: dart run tool/build_translation_site.dart build/ai-translations/packages
      - name: Archive language packs for the release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: tar -C build/translation-site -czf "nodeql-translations-${RELEASE_VERSION}.tar.gz" translations
      - uses: actions/upload-artifact@v7
        with:
          name: translation-packages
          path: build/translation-site/translations
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: nodeql-translations
          path: nodeql-translations-*.tar.gz
          if-no-files-found: error

  build-linux:
    name: Linux x64
    needs: [prepare, quality, translations]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: translation-packages
          path: assets/translations
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsqlite3-dev ninja-build
      - run: flutter pub get
      - name: Build Linux bundle
        run: >
          flutter build linux --release
          -t lib/main.dart
          --dart-define=NODEQL_RELEASE_OWNER=${{ github.repository_owner }}
          --dart-define=NODEQL_RELEASE_REPOSITORY=${{ github.event.repository.name }}
          --dart-define=NODEQL_TRANSLATION_MANIFEST_URL=${{ env.TRANSLATION_MANIFEST_URL }}
          --dart-define=NODEQL_TRANSLATION_CONTRIBUTION_URL=${{ env.TRANSLATION_CONTRIBUTION_URL }}
      - name: Package Linux bundle and Debian package
        shell: bash
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
          RELEASE_VERSION="${PUBSPEC_VERSION%%+*}"
          tar -C build/linux/x64/release/bundle -czf "nodeql-linux-x64-${RELEASE_VERSION}.tar.gz" .
          mkdir -p package/DEBIAN package/usr/lib/nodeql package/usr/bin package/usr/share/applications
          cp -R build/linux/x64/release/bundle/. package/usr/lib/nodeql/
          ln -s /usr/lib/nodeql/nodeql package/usr/bin/nodeql
          cat > package/DEBIAN/control <<EOF
          Package: nodeql
          Version: ${RELEASE_VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: NodeQL Team <nodeql-support@codespiresolutions.digital>
          Depends: libc6, libstdc++6, libgtk-3-0, libsqlite3-0, zenity | kdialog | qarma
          Homepage: https://github.com/${{ github.repository }}
          Description: Local-first visual SQL learning and development
          EOF
          cat > package/usr/share/applications/nodeql.desktop <<EOF
          [Desktop Entry]
          Name=NodeQL
          Comment=Visual SQL learning and development
          Exec=/usr/bin/nodeql
          Terminal=false
          Type=Application
          Categories=Development;Education;
          EOF
          dpkg-deb --build --root-owner-group package "nodeql_${RELEASE_VERSION}_amd64.deb"
      - name: Import Linux release signing key
        if: >-
          ${{
            env.LINUX_GPG_PRIVATE_KEY != '' &&
            env.LINUX_GPG_PASSPHRASE != '' &&
            env.LINUX_GPG_KEY_ID != '' &&
            env.LINUX_GPG_KEY_ID != '__SET_ME__'
          }}
        shell: bash
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/nodeql-gpg"
          install -d -m 700 "${GNUPGHOME}"
          printf '%s' "${LINUX_GPG_PRIVATE_KEY}" | base64 --decode > "${RUNNER_TEMP}/nodeql-release-key.asc"
          gpg --batch --import "${RUNNER_TEMP}/nodeql-release-key.asc"
      - name: Sign Linux packages
        if: >-
          ${{
            env.LINUX_GPG_PRIVATE_KEY != '' &&
            env.LINUX_GPG_PASSPHRASE != '' &&
            env.LINUX_GPG_KEY_ID != '' &&
            env.LINUX_GPG_KEY_ID != '__SET_ME__'
          }}
        shell: bash
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/nodeql-gpg"
          for artifact in nodeql-linux-x64-*.tar.gz nodeql_*_amd64.deb; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${LINUX_GPG_PASSPHRASE}" \
              --local-user "${LINUX_GPG_KEY_ID}" \
              --armor --detach-sign "${artifact}"
            gpg --batch --verify "${artifact}.asc" "${artifact}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nodeql-linux
          path: |
            nodeql-linux-x64-*.tar.gz
            nodeql_*_amd64.deb
            nodeql-linux-x64-*.tar.gz.asc
            nodeql_*_amd64.deb.asc
          if-no-files-found: error

  build-macos:
    name: macOS
    needs: [prepare, quality, translations]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: macos-latest
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: translation-packages
          path: assets/translations
      - name: Validate Sparkle secrets
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" && -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            exit 0
          fi
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" || -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            echo "::error::Configure both Sparkle repository secrets."
            exit 1
          fi
          # Check the pair before publishing a release that existing installs would reject.
          printf '%s\n' "${SPARKLE_PRIVATE_ED_KEY}" | swift -e '
            import CryptoKit
            import Foundation
            guard let encoded = readLine(), let seed = Data(base64Encoded: encoded),
                  let key = try? Curve25519.Signing.PrivateKey(rawRepresentation: seed),
                  key.publicKey.rawRepresentation.base64EncodedString() == CommandLine.arguments[1]
            else {
              fputs("Sparkle signing keys do not match or the private key is not a 32-byte seed\n", stderr)
              exit(1)
            }
          ' "${SPARKLE_PUBLIC_ED_KEY}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Import Apple Developer ID certificate
        if: >-
          ${{
            env.APPLE_CERTIFICATE_P12_BASE64 != '' &&
            env.APPLE_CERTIFICATE_PASSWORD != '' &&
            env.APPLE_SIGNING_IDENTITY != '' &&
            env.APPLE_SIGNING_IDENTITY != '__SET_ME__'
          }}
        shell: bash
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/nodeql-developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/nodeql-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -F "${APPLE_SIGNING_IDENTITY}" >/dev/null

      - name: Build macOS application
        run: >
          flutter build macos --release
          -t lib/main.dart
          --dart-define=NODEQL_RELEASE_OWNER=${{ github.repository_owner }}
          --dart-define=NODEQL_RELEASE_REPOSITORY=${{ github.event.repository.name }}
          --dart-define=NODEQL_TRANSLATION_MANIFEST_URL=${{ env.TRANSLATION_MANIFEST_URL }}
          --dart-define=NODEQL_TRANSLATION_CONTRIBUTION_URL=${{ env.TRANSLATION_CONTRIBUTION_URL }}
      - name: Configure macOS updates
        if: env.SPARKLE_PUBLIC_ED_KEY != ''
        shell: bash
        run: >-
          bash tool/configure_macos_sparkle.sh
          build/macos/Build/Products/Release/NodeQL.app
          "$GITHUB_REPOSITORY"
      - name: Sign macOS application
        shell: bash
        run: |
          APP_PATH="build/macos/Build/Products/Release/NodeQL.app"
          ENTITLEMENTS="$(mktemp)"
          trap 'rm -f "${ENTITLEMENTS}"' EXIT
          codesign -d --entitlements :- "${APP_PATH}" > "${ENTITLEMENTS}"
          if plutil -extract 'com\.apple\.security\.get-task-allow' raw "${ENTITLEMENTS}" >/dev/null 2>&1; then
            plutil -remove 'com\.apple\.security\.get-task-allow' "${ENTITLEMENTS}"
          fi

          if [[ -n "${APPLE_CERTIFICATE_P12_BASE64}" &&
                -n "${APPLE_CERTIFICATE_PASSWORD}" &&
                -n "${APPLE_SIGNING_IDENTITY}" &&
                "${APPLE_SIGNING_IDENTITY}" != '__SET_ME__' ]]; then
            SIGN_ARGS=(--sign "${APPLE_SIGNING_IDENTITY}" --timestamp --options runtime)
            # Sign nested code before its enclosing bundles.
            while IFS= read -r -d '' binary; do
              [[ "${binary}" != "${APP_PATH}/Contents/MacOS/NodeQL" ]] || continue
              [[ "$(file -b "${binary}")" == *Mach-O* ]] || continue
              codesign --force "${SIGN_ARGS[@]}" --preserve-metadata=entitlements "${binary}"
            done < <(find "${APP_PATH}/Contents" -type f \
              \( -name '*.dylib' -o -perm -111 \) -print0)
            while IFS= read -r -d '' nested_bundle; do
              codesign --force "${SIGN_ARGS[@]}" --preserve-metadata=entitlements "${nested_bundle}"
            done < <(find "${APP_PATH}/Contents" -depth -type d \
              \( -name '*.framework' -o -name '*.xpc' -o -name '*.appex' -o -name '*.app' \) -print0)
          else
            SIGN_ARGS=(--sign -)
          fi
          codesign --force "${SIGN_ARGS[@]}" --entitlements "${ENTITLEMENTS}" "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
      - name: Package macOS disk images
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/NodeQL.app"
          DMG_ROOT="$(mktemp -d "${RUNNER_TEMP}/nodeql-dmg.XXXXXX")"
          trap 'rm -rf "${DMG_ROOT}"' EXIT
          ditto "${APP_PATH}" "${DMG_ROOT}/NodeQL.app"
          hdiutil create -volname "NodeQL Portable" -srcfolder "${DMG_ROOT}" \
            -ov -format UDZO "nodeql-macos-${RELEASE_VERSION}-portable.dmg"
          ln -s /Applications "${DMG_ROOT}/Applications"
          hdiutil create -volname "NodeQL" -srcfolder "${DMG_ROOT}" \
            -ov -format UDZO "nodeql-macos-${RELEASE_VERSION}.dmg"
      - name: Notarize and staple macOS disk images
        if: >-
          ${{
            env.APPLE_CERTIFICATE_P12_BASE64 != '' &&
            env.APPLE_CERTIFICATE_PASSWORD != '' &&
            env.APPLE_SIGNING_IDENTITY != '' &&
            env.APPLE_SIGNING_IDENTITY != '__SET_ME__' &&
            env.APPLE_NOTARY_KEY_BASE64 != '' &&
            env.APPLE_NOTARY_KEY_ID != '' &&
            env.APPLE_NOTARY_KEY_ID != '__SET_ME__' &&
            env.APPLE_NOTARY_ISSUER_ID != '' &&
            env.APPLE_NOTARY_ISSUER_ID != '__SET_ME__'
          }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | base64 -D > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"
          for DMG in "nodeql-macos-${RELEASE_VERSION}.dmg" "nodeql-macos-${RELEASE_VERSION}-portable.dmg"; do
            xcrun notarytool submit "${DMG}" --wait \
              --key "${NOTARY_KEY_PATH}" \
              --key-id "${APPLE_NOTARY_KEY_ID}" \
              --issuer "${APPLE_NOTARY_ISSUER_ID}"
            xcrun stapler staple "${DMG}"
            xcrun stapler validate "${DMG}"
            spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG}"
          done
      - name: Sign macOS update and appcast
        if: env.SPARKLE_PUBLIC_ED_KEY != ''
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          SIGN_UPDATE="build/macos/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          test -x "${SIGN_UPDATE}"
          APP_INFO="build/macos/Build/Products/Release/NodeQL.app/Contents/Info.plist"
          VERSION="$(plutil -extract CFBundleShortVersionString raw "${APP_INFO}")"
          BUILD="$(plutil -extract CFBundleVersion raw "${APP_INFO}")"
          DMG="nodeql-macos-${VERSION}.dmg"
          SIGNATURE="$(printf '%s\n' "${SPARKLE_PRIVATE_ED_KEY}" | "${SIGN_UPDATE}" --ed-key-file - -p "${DMG}")"
          LENGTH="$(stat -f %z "${DMG}")"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases"
          cat > nodeql-macos-appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>NodeQL Updates</title>
              <item>
                <title>NodeQL ${VERSION}</title>
                <link>${RELEASE_URL}/tag/v${VERSION}</link>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0.0</sparkle:minimumSystemVersion>
                <enclosure url="${RELEASE_URL}/download/v${VERSION}/${DMG}"
                           sparkle:edSignature="${SIGNATURE}" length="${LENGTH}"
                           type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          printf '%s\n' "${SPARKLE_PRIVATE_ED_KEY}" | "${SIGN_UPDATE}" --ed-key-file - nodeql-macos-appcast.xml
          xmllint --noout nodeql-macos-appcast.xml
      - uses: actions/upload-artifact@v7
        with:
          name: nodeql-macos
          path: |
            nodeql-macos-*.dmg
            nodeql-macos-appcast.xml
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: [prepare, quality, translations]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: translation-packages
          path: assets/translations
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows bundle
        run: >
          flutter build windows --release
          -t lib/main.dart
          --dart-define=NODEQL_RELEASE_OWNER=${{ github.repository_owner }}
          --dart-define=NODEQL_RELEASE_REPOSITORY=${{ github.event.repository.name }}
          --dart-define=NODEQL_TRANSLATION_MANIFEST_URL=${{ env.TRANSLATION_MANIFEST_URL }}
          --dart-define=NODEQL_TRANSLATION_CONTRIBUTION_URL=${{ env.TRANSLATION_CONTRIBUTION_URL }}
      - name: Decode Windows code-signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_P12_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'nodeql-codesigning.pfx'
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($signtool)) { throw 'signtool.exe was not found.' }
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sign Windows application files
        if: ${{ env.WINDOWS_CERTIFICATE_P12_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          Get-ChildItem $releaseDir -File -Recurse |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            ForEach-Object {
              & $env:WINDOWS_SIGNTOOL_PATH sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Code signing failed: $($_.FullName)" }
            }

      - name: Package Windows installer
        shell: pwsh
        run: |
          $releaseDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          $releaseVersion = $pubspecVersion.Split('+')[0]
          $installerName = "nodeql-windows-x64-$releaseVersion-setup.exe"
          $issPath = Join-Path $env:RUNNER_TEMP 'nodeql.iss'
          @'
          [Setup]
          AppId={{4D52F3AB-88BB-4E7B-9761-25A7CDE6CE34}
          AppName=NodeQL
          AppVersion=__VERSION__
          AppPublisher=NodeQL contributors
          AppPublisherURL=https://github.com/__REPOSITORY__
          DefaultDirName={autopf}\NodeQL
          DefaultGroupName=NodeQL
          UninstallDisplayIcon={app}\nodeql.exe
          OutputDir=__OUTPUT_DIR__
          OutputBaseFilename=__INSTALLER_NAME__
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern

          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Files]
          Source: "__APP_DIR__\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\NodeQL"; Filename: "{app}\nodeql.exe"
          Name: "{autodesktop}\NodeQL"; Filename: "{app}\nodeql.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\nodeql.exe"; Description: "Launch NodeQL"; Flags: nowait postinstall skipifsilent
          '@.Replace('__VERSION__', $releaseVersion).
            Replace('__REPOSITORY__', '${{ github.repository }}').
            Replace('__OUTPUT_DIR__', $env:GITHUB_WORKSPACE).
            Replace('__INSTALLER_NAME__', $installerName.Replace('.exe', '')).
            Replace('__APP_DIR__', $releaseDir) |
            Set-Content -Path $issPath -Encoding utf8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
      - name: Sign Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE_P12_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          $releaseVersion = $pubspecVersion.Split('+')[0]
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "nodeql-windows-x64-$releaseVersion-setup.exe"
          & $env:WINDOWS_SIGNTOOL_PATH sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $installerPath
          if ($LASTEXITCODE -ne 0) { throw "Code signing failed: $installerPath" }
          $installerSignature = Get-AuthenticodeSignature $installerPath
          if ($installerSignature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($installerSignature.Status)"
          }
      - name: Package portable Windows bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $releaseDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $portableDir = Join-Path $env:RUNNER_TEMP 'nodeql-windows-portable'
          Copy-Item -LiteralPath $releaseDir -Destination $portableDir -Recurse

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'Visual Studio C++ tools were not found.' }
          $redistRoot = Join-Path $visualStudio 'VC\Redist\MSVC'
          $crtDir = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Where-Object { $_.Name -as [version] } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-Item (Join-Path $_.FullName 'x64\Microsoft.VC*.CRT') -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crtDir) { throw 'Visual C++ x64 redistributable files were not found.' }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -LiteralPath (Join-Path $crtDir.FullName $dll) -Destination $portableDir
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "nodeql-windows-x64-$env:RELEASE_VERSION-portable.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($portableDir, $zipPath)
      - uses: actions/upload-artifact@v7
        with:
          name: nodeql-windows
          path: |
            nodeql-windows-x64-*-setup.exe
            nodeql-windows-x64-*-portable.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build-linux, build-macos, build-windows]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.should-release == 'true' &&
        needs.build-linux.result == 'success' &&
        needs.build-macos.result == 'success' &&
        needs.build-windows.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nodeql-*
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Read release description from pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ needs.prepare.outputs.release-pr-number }}
        shell: bash
        run: |
          gh pr view "${RELEASE_PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json body \
            --jq '.body' > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "The release pull request #${RELEASE_PR_NUMBER} has no description." >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --notes-file release-notes.md \
            --title "NodeQL ${RELEASE_VERSION}"

  publish-translations:
    name: Publish release language catalog
    needs: publish
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/translations-pages.yml
