name: Dev Branch Cleanup

on:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions: {}

jobs:
  sync-dev:
    name: Sync master back to dev
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Sync master into dev without rewriting history
        shell: bash
        env:
          MERGED_DEV_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash tool/sync_dev_after_merge.sh
