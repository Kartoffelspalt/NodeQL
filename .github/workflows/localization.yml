name: Validate translations

on:
  pull_request:
    paths:
      - 'assets/translations/**'
      - 'translations/**'
      - 'tool/validate_translations.dart'
      - 'tool/generate_translations.dart'
      - 'tool/src/ai_translation_generator.dart'
      - 'tool/build_translation_site.dart'
      - 'lib/localization/**'
  push:
    branches: [master, main]
    paths:
      - 'assets/translations/**'
      - 'translations/**'
      - 'tool/validate_translations.dart'
      - 'tool/generate_translations.dart'
      - 'tool/src/ai_translation_generator.dart'
      - 'tool/build_translation_site.dart'
      - 'lib/localization/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/validate_translations.dart
      - run: flutter test test/localization test/tool/ai_translation_generator_test.dart test/tool/build_translation_site_test.dart
