name: Publish translations

on:
  workflow_call:
    inputs:
      release-run-id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      release-run-id:
        description: Successful Desktop Release run ID containing translation-packages
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: translations-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: translation-packages
          path: build/translation-site/translations
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id || github.run_id }}
      - name: Add catalog landing page
        run: printf '<h1>NodeQL release language packages</h1>\n' > build/translation-site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/translation-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
