<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Local-first visual SQLite learning and development.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NodeQL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NodeQL</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #10141e; }
    #nodeql-startup {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e8edfc;
      background: #10141e;
      font: 16px/1.5 system-ui, sans-serif;
    }
    #nodeql-startup h1 { margin: 0 0 8px; font-size: 28px; }
    #nodeql-startup p { margin: 0 0 16px; }
    #nodeql-startup progress { width: 100%; accent-color: #6296ff; }
    #nodeql-startup button {
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      background: #c5d9ff;
      color: #10141e;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <main id="nodeql-startup">
    <div>
      <h1>NodeQL</h1>
      <p id="nodeql-startup-status" role="status">Loading the sample database and query…</p>
      <progress id="nodeql-startup-progress" aria-label="Loading NodeQL"></progress>
      <button id="nodeql-startup-retry" type="button" hidden>Reload demo</button>
      <noscript>Enable JavaScript to run the interactive demo.</noscript>
    </div>
  </main>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
